<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interactive Phone</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

/* ✅ مفيش خلفية خالص */
body{
  background: transparent;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* PHONE */

.phone{
  width:290px;
  height:610px;
  border-radius:40px;
  overflow:hidden;
  position:relative;
  background:#6f79e3;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  border:6px solid #000;
}

/* LOCK SCREEN */

.lock-screen{
  position:absolute;
  width:100%;
  height:100%;
  background: linear-gradient(
    180deg,
    rgba(255,255,255,.08),
    rgba(0,0,0,.25)
  );
  backdrop-filter:blur(12px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.time{
  font-size:58px;
  color:white;
  font-weight:bold;
}

.date{
  color:#eee;
  margin-top:8px;
  font-size:14px;
}

.password-box{
  margin-top:35px;
  display:grid;
  grid-template-columns:repeat(3,60px);
  gap:12px;
}

.key{
  width:60px;
  height:60px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.15);
  color:white;
  font-size:22px;
  cursor:pointer;
}

.pass-view{
  margin-top:22px;
  height:20px;
  color:white;
  letter-spacing:8px;
  font-size:24px;
}

/* HOME */

.home{
  width:100%;
  height:100%;
  background: linear-gradient(180deg,#9ea4ff,#6571dc);
  position:relative;
  overflow:hidden;
  display:none;
}

.circle1,.circle2{
  position:absolute;
  border-radius:50%;
}

.circle1{
  width:360px;
  height:360px;
  background:rgba(255,255,255,.08);
  top:-120px;
  left:-50px;
}

.circle2{
  width:250px;
  height:250px;
  background:rgba(0,0,0,.08);
  top:150px;
  left:30px;
}

.status{
  display:flex;
  justify-content:space-between;
  padding:12px;
  color:white;
  font-size:12px;
  position:relative;
  z-index:2;
}

.camera{
  width:14px;
  height:14px;
  background:black;
  border-radius:50%;
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
}

.widgets{
  position:relative;
  z-index:2;
  display:flex;
  gap:10px;
  padding:25px 15px 10px;
}

.weather{
  width:115px;
  height:120px;
  border-radius:20px;
  background:rgba(0,0,0,.15);
  backdrop-filter:blur(10px);
  padding:15px;
  color:white;
}

.search{
  width:240px;
  height:42px;
  background:#eee;
  border-radius:30px;
  margin:18px auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
}

.apps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  padding:15px;
}

.app{
  text-align:center;
  color:white;
  cursor:pointer;
}

.icon{
  width:52px;
  height:52px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  margin:auto;
  box-shadow:0 8px 18px rgba(0,0,0,.2);
}

.store{background:#ff2d55;}
.gallery{background:#ff00aa;}
.play{background:white;color:black;}
.google{background:#eee;color:black;}
.phone-icon{background:#22c55e;}
.chat{background:white;color:#2563eb;}
.net{background:#7c3aed;}
.camera-icon{background:#ddd;color:black;}

/* APP SCREEN */

.app-screen{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
  z-index:999;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  animation:open .35s;
}

.back-btn{
  position:absolute;
  top:18px;
  left:18px;
  background:#f1f1f1;
  padding:8px 14px;
  border-radius:18px;
  cursor:pointer;
}

@keyframes open{
  from{transform:scale(.8);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

</style>
</head>

<body>

<div class="phone">

  <div class="lock-screen" id="lock">

    <div class="time">10:00</div>
    <div class="date">Monday, September 9</div>

    <div class="pass-view" id="passView"></div>

    <div class="password-box">
      <button class="key" onclick="addNum(1)">1</button>
      <button class="key" onclick="addNum(2)">2</button>
      <button class="key" onclick="addNum(3)">3</button>
      <button class="key" onclick="addNum(4)">4</button>
      <button class="key" onclick="addNum(5)">5</button>
      <button class="key" onclick="addNum(6)">6</button>
      <button class="key" onclick="addNum(7)">7</button>
      <button class="key" onclick="addNum(8)">8</button>
      <button class="key" onclick="addNum(9)">9</button>
    </div>

  </div>

  <div class="home" id="home">

    <div class="circle1"></div>
    <div class="circle2"></div>

    <div class="camera"></div>

    <div class="status">
      <span>10:00</span>
      <span>📶 100%</span>
    </div>

    <div class="widgets">
      <div class="weather">☁️ 2°</div>
    </div>

    <div class="search">
      <span>🎤</span>
      <span>🔍</span>
    </div>

  </div>

</div>

<script>

let password = "";
const correctPass = "1234";

function addNum(num){
  if(password.length < 4){
    password += num;
    document.getElementById("passView").innerHTML += "•";
  }

  if(password === correctPass){
    setTimeout(()=>{
      document.getElementById("lock").style.display="none";
      document.getElementById("home").style.display="block";
    },300);
  }

  if(password.length === 4 && password !== correctPass){
    setTimeout(()=>{
      alert("كلمة المرور غير صحيحة ❌");
      password = "";
      document.getElementById("passView").innerHTML = "";
    },300);
  }
}

</script>

</body>
</html>
